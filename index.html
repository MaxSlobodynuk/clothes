<body>
<main class="page">

  <header class="hero">
    <h1 class="hero__title">MAISON<br>МАГАЗИН<br>ЛЮКСОВИХ БРЕНДІВ</h1>
    <p class="hero__subtitle">викуп із закритих фабрик</p>
  </header>

  <section class="gallery">
    <div class="gallery__main">
      <img src="images/1.jpg" alt="Сумка Chanel Classic Flap чорна" style="object-position: center 55%">
    </div>
    <div class="gallery__side">
      <div class="gallery__thumb">
        <img src="images/2.jpg" alt="Сумка Hermès Birkin чорна" style="object-position: center 60%">
      </div>
      <div class="gallery__thumb">
        <img src="images/3.jpg" alt="Туфлі Saint Laurent Opyum" style="object-position: center 60%">
      </div>
    </div>
  </section>

  <ul class="features">
    <li class="features__item">гарантія<br>якості</li>
    <li class="features__item">автентична<br>якість</li>
    <li class="features__item">швидка<br>доставка</li>
  </ul>

  <section class="look">
    <img src="images/image 123.png" alt="Образ Saint Laurent">
  </section>

  <div class="cta">
    <p class="cta__label">перейти у телеграм</p>
    <a class="cta__btn" href="https://t.me/maisonprivebuyer" id="purchase-button" target="_blank" rel="noopener">
      <span class="cta__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.7 4.3 2.9 11.2c-1.2.5-1.2 1.2-.2 1.5l4.6 1.4 1.7 5.3c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.5c.3-1.3-.5-1.9-1.8-1.4ZM8.4 13.8l9.5-6c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4-1.6-4.9Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="cta__text">Телеграм</span>
      <span class="cta__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
  </div>

</main>

<script>
  // реальна висота видимої області (iOS/Android з панелями браузера)
  function setAppHeight() {
    document.documentElement.style.setProperty("--app-h", window.innerHeight + "px");
  }
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  window.addEventListener("orientationchange", setAppHeight);

  document.getElementById("purchase-button").addEventListener("click", function () {
    fbq("track", "Purchase", { content_name: "Telegram Button Click" });
  });
</script>
